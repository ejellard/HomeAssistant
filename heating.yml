blueprint:
  name: Room Heating - Boiler vs AC
  description: Automatically control room heating using either boiler or AC based on a binary sensor, unless Wiser Away Mode is active.
  domain: automation

  input:
    target_temperature_entity:
      name: Target Temperature Input
      description: The input_number entity that sets the target temperature for this room
      selector:
        entity:
          domain: input_number
    
    ac_entity:
      name: Air Conditioner Climate Entity
      description: The climate entity for the room's air conditioning unit
      selector:
        entity:
          domain: climate
    
    wiser_entity:
      name: Wiser Heating Climate Entity
      description: The climate entity for the room's Wiser heating system
      selector:
        entity:
          domain: climate
    
    heating_mode_sensor:
      name: Heat with AC Binary Sensor
      description: Binary sensor that determines whether to use AC for heating (on) or boiler (off)
      default: binary_sensor.heatwithairconditioning
      selector:
        entity:
          domain: binary_sensor

    wiser_away_mode_entity:
      name: Wiser Away Mode Switch
      description: Entity indicating Wiser Away Mode (must be OFF for the automation to run)
      default: switch.wiser_away_mode
      selector:
        entity:
          domain: switch

    daytime_minimum_temperature:
      name: Daytime Minimum Temperature
      description: Boiler minimum during the day when heating with AC. The AC only heats when the target is above this, day or night.
      default: 15
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: "°C"

    overnight_minimum_temperature:
      name: Overnight Minimum Temperature
      description: Boiler minimum overnight when heating with AC
      default: 8
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: "°C"

    daytime_start:
      name: Daytime Starts
      description: Time the daytime minimum takes over from the overnight minimum
      default: "09:00:00"
      selector:
        time:

    overnight_start:
      name: Overnight Starts
      description: Time the overnight minimum takes over from the daytime minimum
      default: "00:00:00"
      selector:
        time:

triggers:
  - trigger: state
    entity_id: !input target_temperature_entity
  - trigger: state
    entity_id: !input heating_mode_sensor
  # Re-apply the boiler minimum when the day/overnight period changes
  - trigger: time
    at: !input daytime_start
  - trigger: time
    at: !input overnight_start

conditions:
  # Only run when Wiser Away Mode is OFF
  - condition: state
    entity_id: !input wiser_away_mode_entity
    state: "off"

actions:
  - if:
      - condition: state
        entity_id: !input heating_mode_sensor
        state: "off"
    then:
      # Use Wiser boiler for heating
      - action: climate.set_temperature
        data:
          temperature: "{{ states(target_temperature_entity) | float }}"
        target:
          entity_id: !input wiser_entity
      
      - action: climate.turn_off
        data: {}
        target:
          entity_id: !input ac_entity
    
    else:
      # Use AC for heating mode - boiler held at the current minimum
      - action: climate.set_temperature
        data:
          temperature: "{{ boiler_minimum_temperature }}"
        target:
          entity_id: !input wiser_entity
      
      - if:
          - condition: template
            value_template: "{{ states(target_temperature_entity) | float > daytime_minimum_temperature | float }}"
        then:
          # Target above the daytime minimum - use AC for heating
          - action: climate.set_temperature
            data:
              temperature: "{{ (states(target_temperature_entity) | float) + 2 }}"
              hvac_mode: heat
            target:
              entity_id: !input ac_entity

          - action: climate.set_preset_mode
            data:
              preset_mode: quiet
            target:
              entity_id: !input ac_entity
        
        else:
          # Target temperature too low – turn off AC
          - action: climate.turn_off
            data: {}
            target:
              entity_id: !input ac_entity

mode: single

variables:
  target_temperature_entity: !input target_temperature_entity
  daytime_minimum_temperature: !input daytime_minimum_temperature
  overnight_minimum_temperature: !input overnight_minimum_temperature
  daytime_start: !input daytime_start
  overnight_start: !input overnight_start
  is_overnight: >-
    {% set current_time = now().strftime('%H:%M:%S') %}
    {% if overnight_start <= daytime_start %}
      {{ overnight_start <= current_time < daytime_start }}
    {% else %}
      {{ current_time >= overnight_start or current_time < daytime_start }}
    {% endif %}
  boiler_minimum_temperature: >-
    {{ (overnight_minimum_temperature if is_overnight else daytime_minimum_temperature) | float }}
